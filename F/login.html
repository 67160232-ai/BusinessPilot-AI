<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusinessPilot AI | Login</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #020617;
            color: white;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(
                circle,
                #06b6d455,
                transparent
            );
            top: -250px;
            left: -250px;
        }

        body::after {
            content: "";
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(
                circle,
                #2563eb44,
                transparent
            );
            bottom: -250px;
            right: -250px;
        }

        .glass {
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.08);
        }

        .login-card {
            animation: fade .7s ease;
        }

        @keyframes fade {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .btn {
            background: linear-gradient(
                90deg,
                #06b6d4,
                #2563eb
            );

            transition: .35s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 15px 30px
                rgba(6,182,212,.35);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        input {
            background: #0f172a;
        }

    </style>

</head>


<body>

<div class="min-h-screen flex items-center justify-center p-6">

    <div class="login-card glass rounded-3xl w-full max-w-md p-10">

        <!-- LOGO -->

        <div class="text-center">

            <div
                class="mx-auto w-20 h-20 rounded-2xl
                bg-gradient-to-r from-cyan-400 to-blue-600
                flex justify-center items-center
                text-3xl font-bold">

                AI

            </div>

            <h1 class="text-3xl font-bold mt-6">
                BusinessPilot AI
            </h1>

            <p class="text-gray-400 mt-2">
                Sign in to continue
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm" class="mt-10">

            <!-- Username -->

            <div>

                <label class="text-sm text-gray-300">
                    Username
                </label>

                <div class="relative mt-2">

                    <i
                        class="fa-solid fa-user
                        absolute left-4 top-1/2
                        -translate-y-1/2
                        text-gray-500">
                    </i>

                    <input
                        id="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Username"
                        required
                        class="w-full rounded-xl py-4 pl-12 pr-4
                        border border-slate-700
                        focus:border-cyan-400
                        outline-none">

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mt-6">

                <label class="text-sm text-gray-300">
                    Password
                </label>

                <div class="relative mt-2">

                    <i
                        class="fa-solid fa-lock
                        absolute left-4 top-1/2
                        -translate-y-1/2
                        text-gray-500">
                    </i>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="********"
                        required
                        class="w-full rounded-xl py-4 pl-12 pr-12
                        border border-slate-700
                        focus:border-cyan-400
                        outline-none">

                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute right-4 top-1/2
                        -translate-y-1/2
                        text-gray-400">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- REMEMBER -->

            <div
                class="flex items-center justify-between
                mt-6 text-sm">

                <label
                    class="flex items-center gap-2
                    cursor-pointer">

                    <input
                        id="rememberMe"
                        type="checkbox"
                        class="accent-cyan-500">

                    <span class="text-gray-400">
                        Remember me
                    </span>

                </label>


                <a
                    href="#"
                    class="text-cyan-400
                    hover:text-cyan-300">

                    Forgot Password?

                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                id="loginButton"
                type="submit"
                class="btn w-full py-4 rounded-xl
                mt-8 font-semibold text-lg">

                <i
                    class="fa-solid fa-right-to-bracket mr-2">
                </i>

                Sign In

            </button>


            <!-- STATUS -->

            <p
                id="loginStatus"
                class="text-center
                text-sm mt-4
                text-gray-400">

            </p>


            <!-- DIVIDER -->

            <div
                class="flex items-center gap-4 my-8">

                <div
                    class="flex-1 h-px
                    bg-slate-700">
                </div>

                <span
                    class="text-gray-500 text-sm">

                    OR

                </span>

                <div
                    class="flex-1 h-px
                    bg-slate-700">
                </div>

            </div>


            <!-- GOOGLE -->

            <button
                type="button"
                class="w-full border border-slate-700
                rounded-xl py-4
                hover:bg-slate-800
                transition">

                <i
                    class="fa-brands fa-google mr-2">
                </i>

                Continue with Google

            </button>


            <!-- REGISTER -->

            <p
                class="text-center
                text-gray-400 mt-8">

                Don't have an account?

                <a
                    href="register.html"
                    class="text-cyan-400
                    hover:text-cyan-300
                    font-semibold">

                    Create Account

                </a>

            </p>

        </form>

    </div>

</div>


<script>

/* =========================================
   BUSINESSPILOT API
========================================= */

const API_URL =
    window.BUSINESSPILOT_API_URL ||
    localStorage.getItem("api_url") ||
    "http://127.0.0.1:8000";


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

togglePassword.addEventListener(
    "click",
    () => {

        if (password.type === "password") {

            password.type = "text";

            togglePassword.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        } else {

            password.type = "password";

            togglePassword.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    }
);


/* =========================================
   LOGIN
========================================= */

document
    .getElementById("loginForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const rememberMe =
            document
                .getElementById("rememberMe")
                .checked;

        const button =
            document
                .getElementById("loginButton");

        const status =
            document
                .getElementById("loginStatus");


        if (!username || !password) {

            status.textContent =
                "กรุณากรอก Username และ Password";

            return;

        }


        button.disabled = true;

        status.textContent =
            "กำลังเข้าสู่ระบบ...";


        try {

            const response =
                await fetch(
                    `${API_URL}/login`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })

                    }
                );


            let result = {};

            try {

                result =
                    await response.json();

            } catch (_) {

                result = {};

            }


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Username หรือ Password ไม่ถูกต้อง"
                );

            }


            /* =========================
               SAVE TOKEN
            ========================= */

            if (!result.access_token) {

                throw new Error(
                    "Backend ไม่ได้ส่ง access_token กลับมา"
                );

            }


            localStorage.setItem(
                "access_token",
                result.access_token
            );


            /* =========================
               SAVE USER
            ========================= */

            if (result.user) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(result.user)
                );

            }


            /* =========================
               SAVE API URL
            ========================= */

            localStorage.setItem(
                "api_url",
                API_URL
            );


            status.textContent =
                "เข้าสู่ระบบสำเร็จ";


            /* =========================
               GO UPLOAD
            ========================= */

            window.location.href =
                "upload.html";


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            if (
                error.message
                    .toLowerCase()
                    .includes("failed to fetch")
            ) {

                status.textContent =
                    "ไม่สามารถเชื่อมต่อ Backend ได้";

            } else {

                status.textContent =
                    error.message;

            }


            button.disabled = false;

        }

    });

</script>

</body>
</html>
