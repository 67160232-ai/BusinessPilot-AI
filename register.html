<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusinessPilot AI | Register</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#020617;
            color:white;
            overflow-x:hidden;
        }

        body::before{
            content:"";
            position:fixed;
            width:650px;
            height:650px;
            background:radial-gradient(circle,#06b6d455,transparent);
            top:-250px;
            left:-250px;
        }

        body::after{
            content:"";
            position:fixed;
            width:650px;
            height:650px;
            background:radial-gradient(circle,#2563eb44,transparent);
            bottom:-250px;
            right:-250px;
        }

        .glass{
            background:rgba(255,255,255,.05);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.08);
        }

        .btn{
            background:linear-gradient(90deg,#06b6d4,#2563eb);
            transition:.35s;
        }

        .btn:hover{
            transform:translateY(-3px);
            box-shadow:0 15px 30px rgba(6,182,212,.35);
        }

        input{
            background:#0f172a;
        }

    </style>

</head>

<body>

<div class="min-h-screen flex items-center justify-center p-8">

<div class="glass rounded-3xl w-full max-w-xl p-10">

<div class="text-center">

<div class="mx-auto w-20 h-20 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-600 flex items-center justify-center text-3xl font-bold">

AI

</div>

<h1 class="text-3xl font-bold mt-6">

Create Account

</h1>

<p class="text-gray-400 mt-2">

Start analyzing your business with AI

</p>

</div>

<form class="mt-10">

<!-- Full Name -->

<label class="text-sm">

Full Name

</label>

<div class="relative mt-2">

<i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>

<input
type="text"
placeholder="John Doe"
class="w-full rounded-xl py-4 pl-12 border border-slate-700 focus:border-cyan-400 outline-none">

</div>

<!-- Email -->

<div class="mt-6">

<label class="text-sm">

Email

</label>

<div class="relative mt-2">

<i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>

<input
type="email"
placeholder="john@email.com"
class="w-full rounded-xl py-4 pl-12 border border-slate-700 focus:border-cyan-400 outline-none">

</div>

</div>

<!-- Company -->

<div class="mt-6">

<label class="text-sm">

Company Name

</label>

<div class="relative mt-2">

<i class="fa-solid fa-building absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>

<input
type="text"
placeholder="ABC Company"
class="w-full rounded-xl py-4 pl-12 border border-slate-700 focus:border-cyan-400 outline-none">

</div>

</div>

<!-- Password -->

<div class="mt-6">

<label class="text-sm">

Password

</label>

<div class="relative mt-2">

<i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>

<input
id="password"
type="password"
placeholder="********"
class="w-full rounded-xl py-4 pl-12 pr-12 border border-slate-700 focus:border-cyan-400 outline-none">

<button
type="button"
id="togglePassword"
class="absolute right-4 top-1/2 -translate-y-1/2">

<i class="fa-solid fa-eye"></i>

</button>

</div>

<div class="mt-3">

<div class="w-full h-2 rounded-full bg-slate-800">

<div
id="strengthBar"
class="h-2 rounded-full bg-red-500 w-1/4">

</div>

</div>

<p
id="strengthText"
class="text-red-400 text-sm mt-2">

Weak Password

</p>

</div>

</div>
<!-- Confirm Password -->

<div class="mt-6">

<label class="text-sm">

Confirm Password

</label>

<div class="relative mt-2">

<i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>

<input
id="confirmPassword"
type="password"
placeholder="********"
class="w-full rounded-xl py-4 pl-12 border border-slate-700 focus:border-cyan-400 outline-none">

</div>

</div>

<!-- Company Size -->

<div class="mt-6">

<label class="text-sm">

Business Size

</label>

<select
class="w-full mt-2 rounded-xl py-4 px-4 bg-slate-900 border border-slate-700 focus:border-cyan-400 outline-none">

<option>Startup (1-10 Employees)</option>

<option>Small Business (11-50)</option>

<option>Medium Business (51-250)</option>

<option>Enterprise (250+)</option>

</select>

</div>

<!-- Terms -->

<div class="flex items-start gap-3 mt-8">

<input
type="checkbox"
class="accent-cyan-500 mt-1">

<p class="text-gray-400 text-sm leading-6">

I agree to the

<a href="#" class="text-cyan-400">

Terms of Service

</a>

and

<a href="#" class="text-cyan-400">

Privacy Policy

</a>

</p>

</div>

<!-- Register Button -->

<button

type="button"

onclick="window.location.href='dashboard.html'"

class="btn w-full py-4 rounded-xl mt-8 font-semibold text-lg">

<i class="fa-solid fa-user-plus mr-2"></i>

Create Account

</button>

<!-- Divider -->

<div class="flex items-center gap-4 my-8">

<div class="flex-1 h-px bg-slate-700"></div>

<span class="text-gray-500 text-sm">

OR

</span>

<div class="flex-1 h-px bg-slate-700"></div>

</div>

<!-- Google -->

<button

type="button"

class="w-full border border-slate-700 rounded-xl py-4 hover:bg-slate-800 transition">

<i class="fa-brands fa-google mr-2"></i>

Sign up with Google

</button>

<p class="text-center text-gray-400 mt-8">

Already have an account?

<a
href="login.html"
class="text-cyan-400 font-semibold">

Sign In

</a>

</p>

</form>

</div>

</div>

<script>

const password=document.getElementById("password");

const strengthBar=document.getElementById("strengthBar");

const strengthText=document.getElementById("strengthText");

const toggle=document.getElementById("togglePassword");

toggle.onclick=function(){

if(password.type==="password"){

password.type="text";

toggle.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}else{

password.type="password";

toggle.innerHTML='<i class="fa-solid fa-eye"></i>';

}

}

password.addEventListener("keyup",()=>{

let v=password.value.length;

if(v<6){

strengthBar.className="h-2 rounded-full bg-red-500 w-1/4";

strengthText.innerHTML="Weak Password";

strengthText.className="text-red-400 text-sm mt-2";

}

else if(v<10){

strengthBar.className="h-2 rounded-full bg-yellow-500 w-2/4";

strengthText.innerHTML="Medium Password";

strengthText.className="text-yellow-400 text-sm mt-2";

}

else{

strengthBar.className="h-2 rounded-full bg-green-500 w-full";

strengthText.innerHTML="Strong Password";

strengthText.className="text-green-400 text-sm mt-2";

}

});

</script>

</body>

</html>
